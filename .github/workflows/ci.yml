name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Verify build output
        run: |
          test -f build/index.js
          test -f build/index.asset.php
          test -f build/view.js
          test -f build/view.asset.php
          test -f build/index.css
          test -f build/view.css
          if [[ ! -f build/style-view.css && ! -f build/style-index.css ]]; then
            echo "missing style-view.css / style-index.css" >&2
            exit 1
          fi

      - name: Package WordPress zip
        run: npm run package

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeddotes-enhanced-code-block-zip
          path: |
            dist/zeddotes-enhanced-code-block-*.zip
            dist/zeddotes-enhanced-code-block.zip

          if-no-files-found: error
